name: Pipeline Producción Diaria

# ══════════════════════════════════════════════════════════════════════════════
# Pipeline diario Forestal Millalemu
# Descarga NOC Arauco → Genera HTML → Sube FTP → Notifica Telegram
# ══════════════════════════════════════════════════════════════════════════════
#
# Triggers:
#   - PRINCIPAL: el Mac lo lanza a las 23:47 (launchd com.millalemu.produccion-nube → gh workflow run).
#     El cron de GitHub llega con 7–8 h de atraso (02:47 UTC programado → corre ~10:15 UTC), por eso no manda él.
#   - RESPALDO: cron diario 02:47 UTC; si ya hubo una corrida exitosa en las últimas 14 h, no hace nada
#     (así Telegram no llega dos veces).
#   - manual desde la UI de GitHub Actions (botón "Run workflow")
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   ARAUCO_USER, ARAUCO_PASS
#   FTP_HOST, FTP_USER, FTP_PASS
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# ══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '47 2 * * *'    # 02:47 UTC = 22:47 Chile invierno / 23:47 Chile verano
  workflow_dispatch:        # botón manual "Run workflow" en la UI de GitHub

jobs:
  control:
    name: ¿Ya corrió hoy?
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      correr: ${{ steps.c.outputs.correr }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "correr=true" >> $GITHUB_OUTPUT; exit 0; fi
          desde=$(date -u -d '-14 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list --repo "${{ github.repository }}" --workflow pipeline.yml --status success --created ">=$desde" --json databaseId -q 'length')
          echo "corridas exitosas desde $desde: $n"
          if [ "$n" -gt 0 ]; then echo "correr=false" >> $GITHUB_OUTPUT; else echo "correr=true" >> $GITHUB_OUTPUT; fi

  run-pipeline:
    name: Descarga + HTML + FTP + Telegram
    needs: control
    if: needs.control.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # para commitear el histórico del mes archivado

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hacer ejecutable el orquestador
        run: chmod +x run_pipeline.sh

      - name: Correr pipeline
        env:
          TZ: America/Santiago
          ARAUCO_USER:        ${{ secrets.ARAUCO_USER }}
          ARAUCO_PASS:        ${{ secrets.ARAUCO_PASS }}
          FTP_HOST:           ${{ secrets.FTP_HOST }}
          FTP_USER:           ${{ secrets.FTP_USER }}
          FTP_PASS:           ${{ secrets.FTP_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          WIALON_TOKEN:       ${{ secrets.WIALON_TOKEN }}
        run: bash run_pipeline.sh

      - name: Dejar las imágenes para WhatsApp (las baja el Mac de gerencia ~06:30)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: envio-whatsapp
          path: |
            grilla_produccion.png
            grilla_produccion_aereo.png
            grilla_produccion_terrestre.png
            resumen_diario*.txt
            Informe_Zona_*.pdf
          retention-days: 3
          if-no-files-found: warn

      - name: Guardar histórico si cambió (auto-archivado mes anterior)
        if: success()
        run: |
          if ! git diff --quiet historico_cierres_mensuales.csv historico_tm_mensual.csv wialon_km.json; then
            git config user.name "tito-pipeline-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add historico_cierres_mensuales.csv historico_tm_mensual.csv wialon_km.json
            git commit -m "data: cierre automatico del mes anterior [skip ci]"
            git push
            echo "✅ Histórico actualizado y commiteado"
          else
            echo "Histórico sin cambios — nada que commitear"
          fi

      - name: Subir logs como artefacto (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            descarga_log.txt
            pipeline_*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Notificar fallo a Telegram (solo si falla)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MENSAJE="❌ <b>Pipeline Producción FALLÓ</b>
          🕐 $(date '+%Y-%m-%d %H:%M:%S UTC')

          Revisa el log en GitHub Actions:
          ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MENSAJE}" > /dev/null || true
